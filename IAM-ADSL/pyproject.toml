[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iam-adsl"
version = "0.1.0"
description = "WimTech CMD and cuivre study automation"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0",
    "selenium>=4.20",
    "pdfplumber>=0.10,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
